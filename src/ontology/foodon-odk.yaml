## ontology metadata, see https://oboacademy.github.io/obook/howto/odk-migrate-to-odk/ ##
id: foodon
title: FoodOn Food Ontology
description: "FoodOn, the food ontology, contains vocabulary for naming food materials and their anatomical and taxonomic origins, from raw harvested food to processed food products, for humans and domesticated animals."
contact:  damion_dooley [at] sfu [.] ca
license: https://creativecommons.org/licenses/by/4.0/

## general ODK Settings ##
repo: foodon
git_main_branch: master
github_org: FoodOntology
edit_format: ofn
ci:
  - github_actions
documentation:
  documentation_system: mkdocs
export_formats:
  - owl
reasoner: ELK
release_artefacts:
  - base
  - full
##   - simple ##
primary_release: full
edit_format: ofn
use_templates: TRUE
use_context: TRUE # Enables standard prefixes.

#report_fail_on: ERROR
#report_fail_on: None
robot_report:
  fail_on: None
#  custom_profile: TRUE
  report_on:
    - foodon-base.owl

# To refresh a particular robot template: > sh run.sh make components/food_materials.owl
components:
  products:
# Note that for some products, if they have makefile template processing then only use .owl suffix for them
    - filename: product_type_import.ofn
    - filename: siren_augment_codes.ofn
    - filename: robot_sssom_taxonomy.ofn
    - filename: deprecation_import.ofn
    - filename: gaz_import.ofn
    - filename: cdno_import.ofn
    - filename: animal_parts.ofn # A copy of imports/animal/animal_parts.ofn

    - filename: food_materials.owl
      use_template: TRUE
      template_options: --input foodon-edit.ofn --xml-entities --ontology-iri "http://purl.obolibrary.org/obo/foodon/components/food_materials.owl"
      templates: 
#        - robot_animal_parts.tsv  Not used in 
        - robot_animals.tsv
        - robot_meat_cuts.tsv
        - robot_plant_parts.tsv
        - robot_seafood.tsv # Remove when seafood template working

    - filename: food_products.owl
      use_template: TRUE
      template_options: --input foodon-edit.ofn --xml-entities --ontology-iri "http://purl.obolibrary.org/obo/foodon/components/food_products.owl"
      templates: 
        - robot_pasta.tsv
        - robot_wine.tsv
        - robot_dietary_supplement.tsv
        - food_process.tsv

    - filename: food_process.owl
      use_template: TRUE
      template_options: --input foodon-edit.ofn --xml-entities --ontology-iri "http://purl.obolibrary.org/obo/foodon/components/food_process.owl"
      templates: 
        - robot_process.tsv

## FoodOn specific Settings ##
import_group:
  annotation_properties:
        - rdfs:label
        - dc:description
        - dc:source
        - OBI:0001886
        - oboInOwl:hasAlternativeId
        - owl:deprecated
        - IAO:0000115
        - IAO:0000114
        - IAO:0000119
        - IAO:0000111
        - IAO:0100001 # replaced by
        
  products:

    - id: chebi
      use_custom_import_module: TRUE
##      is_large: TRUE ##
##      use_gzipped: TRUE ##
##      mirror_from: http://ftp.ebi.ac.uk/pub/databases/chebi/ontology/chebi_lite.owl.gz
      base_iris:
        - http://purl.obolibrary.org/obo/foodon/imports/chebi_import.owl

    - id: cob
      use_custom_import_module: TRUE

    - id: general ##
      use_custom_import_module: TRUE

    - id: ncbitaxon
      use_custom_import_module: TRUE


robot_java_args: '-Xmx4G'